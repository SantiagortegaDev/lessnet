name: lessnet
description: Comunicacion local sin internet via Bluetooth

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  flutter_blue_plus: ^1.32.12
  google_mlkit_translation: ^0.12.0
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  video_player: ^2.9.2
  open_file: ^3.5.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vault/first_aid/
    - assets/vault/guides/
    - assets/vault/dictionary/
    - assets/vault/maps/
    - assets/vault/wikipedia/
    - assets/vault/translator/
    - assets/vault/translator/lang_packs/
