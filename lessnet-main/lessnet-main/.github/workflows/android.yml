
name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: pip install flet==0.85.1
      - run: pip install flet-permission-handler==0.85.1
      - run: flet build apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk

