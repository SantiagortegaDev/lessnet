name: lessnet
description: Comunicacion local sin internet via Bluetooth

publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  flutter_blue_plus: ^1.32.12
  google_mlkit_translation: ^0.12.0
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  video_player: ^2.9.2
  open_filex: ^4.5.0
  flutter_background_service: ^5.0.7
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.2.2
  encrypt: ^5.0.3
  crypto: ^3.0.5
  http: ^1.2.2
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.4+1
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  package_info_plus: ^9.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/vault/first_aid/
    - assets/vault/guides/
    - assets/vault/dictionary/
    - assets/vault/maps/
    - assets/vault/wikipedia/

