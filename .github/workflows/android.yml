name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate Android project and restore configs
        run: |
          # Save our custom files before regenerating
          cp -r lib /tmp/lib_backup
          cp -r assets /tmp/assets_backup 2>/dev/null || true
          cp -r native /tmp/native_backup 2>/dev/null || true
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_backup.xml
          cp android/app/build.gradle /tmp/build_gradle_backup 2>/dev/null || true

          # Create a fresh Flutter project with correct name and org
          cd /tmp
          flutter create --org com.lessnet --project-name app lessnet_fresh

          # Replace the Android directory with fresh one
          rm -rf "$GITHUB_WORKSPACE/android"
          cp -r /tmp/lessnet_fresh/android "$GITHUB_WORKSPACE/android"

          # Restore our AndroidManifest with BT + storage permissions
          cp /tmp/AndroidManifest_backup.xml "$GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml"

          # Patch build.gradle with our SDK versions and permission_handler config
          if [ -f /tmp/build_gradle_backup ]; then
            cp /tmp/build_gradle_backup "$GITHUB_WORKSPACE/android/app/build.gradle"
            # Remove build.gradle.kts if flutter create generated one (avoids conflict)
            rm -f "$GITHUB_WORKSPACE/android/app/build.gradle.kts"
          else
            # If no backup, patch the generated one with correct SDK versions
            GRADLE="$GITHUB_WORKSPACE/android/app/build.gradle"
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' "$GRADLE"
            sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 34/' "$GRADLE"
          fi

          # ── Install our custom native BLE peripheral Kotlin files ──
          # Extract package from the generated build.gradle
          GRADLE_FILE=""
          if [ -f "$GITHUB_WORKSPACE/android/app/build.gradle.kts" ]; then
            GRADLE_FILE="$GITHUB_WORKSPACE/android/app/build.gradle.kts"
          elif [ -f "$GITHUB_WORKSPACE/android/app/build.gradle" ]; then
            GRADLE_FILE="$GITHUB_WORKSPACE/android/app/build.gradle"
          fi

          PACKAGE=""
          if [ -n "$GRADLE_FILE" ]; then
            # Try namespace first, then applicationId
            PACKAGE=$(grep -E "^\s*namespace" "$GRADLE_FILE" | head -1 | sed -E 's/[^"]*"([^"]+)".*/\1/' | tr -d ' ')
            if [ -z "$PACKAGE" ]; then
              PACKAGE=$(grep -E "^\s*applicationId" "$GRADLE_FILE" | head -1 | sed -E 's/[^"]*"([^"]+)".*/\1/' | tr -d ' ')
            fi
          fi

          # Fallback: find it from the generated MainActivity.kt
          if [ -z "$PACKAGE" ]; then
            GENERATED_MAIN=$(find "$GITHUB_WORKSPACE/android/app/src/main/kotlin" -name "MainActivity.kt" | head -1)
            if [ -n "$GENERATED_MAIN" ]; then
              PACKAGE=$(head -1 "$GENERATED_MAIN" | sed 's/package //' | tr -d ' ')
            fi
          fi

          # Hard fallback
          if [ -z "$PACKAGE" ]; then
            PACKAGE="com.lessnet.lessnet"
          fi

          echo "Detected package: $PACKAGE"

          # NUKE the entire kotlin directory to remove any stale files from flutter create
          rm -rf "$GITHUB_WORKSPACE/android/app/src/main/kotlin"

          # Recreate only the correct package directory
          KOTLIN_DIR="$GITHUB_WORKSPACE/android/app/src/main/kotlin/$(echo $PACKAGE | tr '.' '/')"
          mkdir -p "$KOTLIN_DIR"

          # Replace package placeholder and copy our custom Kotlin files
          sed "s/PACKAGE_PLACEHOLDER/$PACKAGE/g" "$GITHUB_WORKSPACE/native/BlePeripheralPlugin.kt" > "$KOTLIN_DIR/BlePeripheralPlugin.kt"
          sed "s/PACKAGE_PLACEHOLDER/$PACKAGE/g" "$GITHUB_WORKSPACE/native/MainActivity.kt" > "$KOTLIN_DIR/MainActivity.kt"

          echo "Installed custom Kotlin files at: $KOTLIN_DIR"
          ls -la "$KOTLIN_DIR/"
          echo "--- MainActivity.kt head ---"
          head -3 "$KOTLIN_DIR/MainActivity.kt"
          echo "--- BlePeripheralPlugin.kt head ---"
          head -3 "$KOTLIN_DIR/BlePeripheralPlugin.kt"

          # Restore our source code
          rm -rf "$GITHUB_WORKSPACE/lib"
          cp -r /tmp/lib_backup "$GITHUB_WORKSPACE/lib"

          if [ -d "/tmp/assets_backup" ]; then
            rm -rf "$GITHUB_WORKSPACE/assets"
            cp -r /tmp/assets_backup "$GITHUB_WORKSPACE/assets"
          fi

          # Restore native/ directory with custom Kotlin files
          if [ -d "/tmp/native_backup" ]; then
            rm -rf "$GITHUB_WORKSPACE/native"
            cp -r /tmp/native_backup "$GITHUB_WORKSPACE/native"
          fi

          # Use our pubspec.yaml with our dependencies
          cp /tmp/pubspec_backup.yaml "$GITHUB_WORKSPACE/pubspec.yaml"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: LessNet v${{ steps.version.outputs.version_name }}
          body: |
            ## LessNet v${{ steps.version.outputs.version_name }}

            Chat BLE offline sin internet.

            ### Como instalar
            1. Descarga el archivo APK
            2. Activa "Instalar desde fuentes desconocidas" en tu celular
            3. Instala el APK

            La app se actualiza automaticamente si hay una nueva version.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
