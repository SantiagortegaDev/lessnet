name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Flet build apk descarga su propio Flutter SDK,
      # pero necesita que el Android SDK esté configurado.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Android platform & build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Flet Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/flet
          key: flet-flutter-0.85.1

      - name: Install Flet dependencies
        run: pip install flet==0.85.1 flet-permission-handler==0.85.1

      - name: Build APK
        run: flet build apk --skip-flutter-doctor --yes -v

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
