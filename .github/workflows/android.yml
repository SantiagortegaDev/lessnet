name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Catch Dart errors before spending minutes on a Gradle build, and
      # long before publishing a release that would not run.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --exclude-tags golden

      - name: Set up release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lessnet-release.jks"
            echo "path=$RUNNER_TEMP/lessnet-release.jks" >> "$GITHUB_OUTPUT"
            echo "Release keystore installed."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set — the APK will be signed with the debug key and must not be published to users."
          fi

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version_name=${VERSION%%+*}" >> "$GITHUB_OUTPUT"

      # Only publish a release from main, and only when the APK is
      # signed with the real key — a debug-signed release cannot be
      # upgraded and would strand every user who installs it.
      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' && steps.keystore.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: LessNet v${{ steps.version.outputs.version_name }}
          body: |
            ## LessNet v${{ steps.version.outputs.version_name }}

            Comunicación offline por Bluetooth, Wi-Fi Direct y LAN.

            ### Como instalar
            1. Descarga el archivo APK
            2. Activa "Instalar desde fuentes desconocidas" en tu celular
            3. Instala el APK
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
