name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate Android project files
        run: |
          # Save our custom source files
          cp -r lib /tmp/lib_backup
          cp -r assets /tmp/assets_backup 2>/dev/null || true
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          
          # Create a fresh Flutter project with correct name and org
          cd /tmp
          flutter create --org com.lessnet --project-name lessnet lessnet_fresh
          
          # Replace the entire Android directory with fresh one
          rm -rf "$GITHUB_WORKSPACE/android"
          cp -r /tmp/lessnet_fresh/android "$GITHUB_WORKSPACE/android"
          
          # Restore our source code
          rm -rf "$GITHUB_WORKSPACE/lib"
          cp -r /tmp/lib_backup "$GITHUB_WORKSPACE/lib"
          
          if [ -d "/tmp/assets_backup" ]; then
            rm -rf "$GITHUB_WORKSPACE/assets"
            cp -r /tmp/assets_backup "$GITHUB_WORKSPACE/assets"
          fi
          
          # Use our pubspec.yaml with our dependencies
          cp /tmp/pubspec_backup.yaml "$GITHUB_WORKSPACE/pubspec.yaml"

      - name: Add Bluetooth permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Read current manifest
          CONTENT=$(cat "$MANIFEST")
          
          # Bluetooth permissions to inject (before </manifest>)
          PERMS='
            <uses-permission android:name="android.permission.BLUETOOTH" />
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-feature android:name="android.hardware.bluetooth" android:required="false" />
            <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
          '
          
          # Insert permissions before </manifest>
          echo "$CONTENT" | sed "s|</manifest>|${PERMS}\n</manifest>|" > "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
